name: Build Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "**.py"
      - "**.bat"
      - "**.vbs"
      - "requirements.txt"
      - "app_icon.ico"
      - "app_icon.png"
      - "scripts/build_windows.ps1"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build AutoExcel for Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Build Windows package
        shell: powershell
        run: ./scripts/build_windows.ps1

      - name: Verify output
        shell: powershell
        run: |
          if (-not (Test-Path "release/AutoExcel-by-AB-Alves-Windows.zip")) {
            throw "Pacote ZIP nao encontrado"
          }
          if (-not (Test-Path "dist/AutoExcel by AB Alves.exe")) {
            throw "Executavel nao encontrado"
          }
          Get-ChildItem release -Recurse

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoExcel-by-AB-Alves-Windows
          path: release/AutoExcel-by-AB-Alves-Windows.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release for version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/AutoExcel-by-AB-Alves-Windows.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
