name: Build Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "**.py"
      - "**.bat"
      - "**.vbs"
      - "requirements.txt"
      - "app_icon.ico"
      - "app_icon.png"
      - "RELEASE_VERSION"
      - "scripts/build_windows.ps1"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build AutoExcel for Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Build Windows package
        shell: powershell
        run: ./scripts/build_windows.ps1

      - name: Verify output
        shell: powershell
        run: |
          if (-not (Test-Path "release/AutoExcel-by-AB-Alves-Windows.zip")) {
            throw "Pacote ZIP nao encontrado"
          }
          if (-not (Test-Path "dist/AutoExcel by AB Alves.exe")) {
            throw "Executavel nao encontrado"
          }
          Get-ChildItem release -Recurse

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoExcel-by-AB-Alves-Windows
          path: release/AutoExcel-by-AB-Alves-Windows.zip
          if-no-files-found: error
          retention-days: 30

      - name: Read release version
        if: github.ref == 'refs/heads/main'
        id: release_version
        shell: powershell
        run: |
          if (-not (Test-Path "RELEASE_VERSION")) {
            "publish=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $version = (Get-Content "RELEASE_VERSION" -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($version)) {
            "publish=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          if (-not $version.StartsWith("v")) {
            $version = "v$version"
          }
          "tag=$version" >> $env:GITHUB_OUTPUT
          $existing = git ls-remote --tags origin "refs/tags/$version"
          if ([string]::IsNullOrWhiteSpace($existing)) {
            "publish=true" >> $env:GITHUB_OUTPUT
          } else {
            "publish=false" >> $env:GITHUB_OUTPUT
          }

      - name: Publish GitHub Release from main
        if: github.ref == 'refs/heads/main' && steps.release_version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: AutoExcel by AB Alves ${{ steps.release_version.outputs.tag }}
          files: release/AutoExcel-by-AB-Alves-Windows.zip
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Publish GitHub Release for version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/AutoExcel-by-AB-Alves-Windows.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
