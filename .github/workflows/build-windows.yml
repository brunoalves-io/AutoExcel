name: Build Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "**.py"
      - "requirements.txt"
      - "app_icon.ico"
      - "app_icon.png"
      - "RELEASE_VERSION"
      - "scripts/build_windows.ps1"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build AutoExcel for Windows
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Build standalone Windows executable
        shell: powershell
        run: ./scripts/build_windows.ps1

      - name: Verify standalone executable
        shell: powershell
        run: |
          $files = @(Get-ChildItem "release/*.exe")
          if ($files.Count -ne 1) {
            throw "Era esperado exatamente um executavel em release/, encontrados: $($files.Count)"
          }
          $exe = $files[0]
          if ($exe.Length -lt 5MB) {
            throw "Executavel parece incompleto: $($exe.Length) bytes"
          }
          $exe | Format-List Name,Length,FullName

      - name: Smoke test packaged Streamlit server
        shell: powershell
        run: |
          $exe = (Get-ChildItem "release/*.exe" | Select-Object -First 1).FullName
          $port = 8765
          $proc = Start-Process -FilePath $exe -ArgumentList "--streamlit-server", "$port" -PassThru -WindowStyle Hidden
          $ok = $false
          try {
            $deadline = (Get-Date).AddSeconds(120)
            while ((Get-Date) -lt $deadline) {
              if ($proc.HasExited) {
                Write-Host "Servidor empacotado encerrou com codigo $($proc.ExitCode)"
                break
              }
              try {
                $response = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:$port/_stcore/health" -TimeoutSec 2
                if ($response.StatusCode -ge 200 -and $response.StatusCode -lt 300) {
                  $ok = $true
                  Write-Host "Smoke test OK: servidor respondeu HTTP $($response.StatusCode)"
                  break
                }
              } catch {
                Start-Sleep -Milliseconds 500
              }
            }

            if (-not $ok) {
              $logPath = Join-Path $env:TEMP "AutoExcel-startup.log"
              if (Test-Path $logPath) {
                Write-Host "===== AutoExcel-startup.log ====="
                Get-Content $logPath
                Write-Host "================================="
              }
              throw "O executavel foi compilado, mas o servidor interno nao iniciou corretamente"
            }
          } finally {
            if (-not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force
            }
          }

      - name: Upload standalone Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoExcel-by-AB-Alves
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Read release version
        if: github.ref == 'refs/heads/main'
        id: release_version
        shell: powershell
        run: |
          if (-not (Test-Path "RELEASE_VERSION")) {
            "publish=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $version = (Get-Content "RELEASE_VERSION" -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($version)) {
            "publish=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          if (-not $version.StartsWith("v")) {
            $version = "v$version"
          }
          "tag=$version" >> $env:GITHUB_OUTPUT
          $existing = git ls-remote --tags origin "refs/tags/$version"
          if ([string]::IsNullOrWhiteSpace($existing)) {
            "publish=true" >> $env:GITHUB_OUTPUT
          } else {
            "publish=false" >> $env:GITHUB_OUTPUT
          }

      - name: Publish GitHub Release from main
        if: github.ref == 'refs/heads/main' && steps.release_version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: AutoExcel by AB Alves ${{ steps.release_version.outputs.tag }}
          body: |
            Executável único do AutoExcel by AB Alves para Windows.

            Não é necessário instalar Python, bibliotecas ou baixar arquivos adicionais.
            Basta baixar o arquivo `.exe` desta release e executar.
          files: release/*.exe
          fail_on_unmatched_files: true

      - name: Publish GitHub Release for version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
